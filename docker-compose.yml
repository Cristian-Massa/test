version: "3.9"

services:
  db:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: ./server
    container_name: app_server
    restart: always
    environment:
      PORT: ${BACKEND_PORT}
      HOST: ${HOST}
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
      FRONT_URL: ${FRONT_URL}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - db

  client:
    build: ./client
    container_name: app_client
    restart: always
    environment:
      VITE_BASE_URL: ${VITE_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  db_data:
